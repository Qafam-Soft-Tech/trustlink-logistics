# Render blueprint — reference deployment for the TrustLink API.
# Edit the plan values and fill the `sync: false` secrets in the Render dashboard.
databases:
  - name: trustlink-db
    databaseName: trustlink
    user: trustlink
    plan: starter

services:
  - type: web
    name: trustlink-api
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trustlink-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_MIGRATIONS_RUN
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMS_PROVIDER
        value: termii
      - key: SMS_BASE_URL
        value: https://api.ng.termii.com/api
      - key: SMS_SENDER_ID
        value: TrustLink
      - key: SMS_PROVIDER_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: THROTTLE_LIMIT
        value: "120"
      - key: PAYMENT_PROCESSING_TTL_MINUTES
        value: "15"
      - key: REVIEW_PHONE
        sync: false
      - key: REVIEW_OTP
        sync: false
